name: expense-splitter

services:
  app:
    build: .
    container_name: expense-splitter-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: expense-splitter-db
    environment:
      POSTGRES_DB: expense_splitter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: